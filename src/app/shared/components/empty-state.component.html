<div class="empty">
  <div class="icon" aria-hidden="true"><i class="pi" [class]="icon"></i></div>
  <h3>{{ title }}</h3>
  @if (subtitle) { <p>{{ subtitle }}</p> }
  @if (actionLabel) {
    <p-button [label]="actionLabel" icon="pi pi-arrow-right" (onClick)="actionClick.emit()" />
  }
  <ng-content />
</div>

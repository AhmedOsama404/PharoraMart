<div class="section-head">
  <div>
    <h2>{{ title }}</h2>
    @if (subtitle) { <p>{{ subtitle }}</p> }
  </div>
  @if (link) {
    @if (external()) {
      <a [href]="link" target="_blank" rel="noopener noreferrer" class="view-all">{{ label() }} <i class="pi pi-arrow-right flip-rtl" aria-hidden="true"></i></a>
    } @else {
      <a [routerLink]="link" class="view-all">{{ label() }} <i class="pi pi-arrow-right flip-rtl" aria-hidden="true"></i></a>
    }
  }
</div>

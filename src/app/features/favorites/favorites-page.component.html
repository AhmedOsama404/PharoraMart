<h1>{{ i18n.t('favorites.title') }}</h1>
<p class="sub">{{ i18n.t('favorites.subtitle') }}</p>
<app-data-boundary [state]="boundaryState()" [error]="error()" (retry)="retry()">
  <ng-template #skeleton>
    <div class="grid" aria-busy="true">
      @for (i of [1,2,3,4]; track i) { <div class="fav-skeleton"></div> }
    </div>
  </ng-template>
  <ng-template #empty>
    <app-empty-state icon="pi-heart" [title]="i18n.t('favorites.emptyTitle')"
      [subtitle]="i18n.t('favorites.emptySubtitle')" [actionLabel]="i18n.t('favorites.browse')" (actionClick)="go('/products')" />
  </ng-template>
  <ng-template #content>
    <div class="grid">
      @for (p of items(); track p.id) {
        <app-product-card [product]="p" (add)="moveToCart($event)" (favToggle)="remove($event)" />
      }
    </div>
  </ng-template>
</app-data-boundary>

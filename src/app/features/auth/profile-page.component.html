<h1>{{ i18n.t('auth.profileTitle') }}</h1>
<p class="sub">{{ i18n.t('auth.profileSubtitle') }}</p>
<!-- <p-message severity="info" size="small" [text]="i18n.t('auth.demoNotice')" /> -->
@if (auth.user(); as u) {
  <p-card class="card">
    <div class="row"><span>{{ i18n.t('auth.name') }}</span><strong>{{ u.name }}</strong></div>
    <div class="row"><span>{{ i18n.t('auth.email') }}</span><strong>{{ u.email }}</strong></div>
    @if (u.phone) { <div class="row"><span>{{ i18n.t('auth.phone') }}</span><strong>{{ u.phone }}</strong></div> }
    <div class="actions">
      <p-button [label]="i18n.t('nav.orders')" severity="secondary" [outlined]="true" (onClick)="go('/orders')" />
      <p-button [label]="i18n.t('nav.logout')" severity="danger" [outlined]="true" (onClick)="logout()" />
    </div>
  </p-card>
}
